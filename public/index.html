<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cercanías</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#16202A;--card:#1f2d3a;--tx:#e8eef3;--mut:#8ea0b0}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
#map{position:absolute;inset:0}
header{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(var(--bg),transparent)}
h1{margin:0 0 8px;font-size:20px}
input{width:100%;padding:10px 12px;border-radius:10px;border:0;background:var(--card);color:var(--tx);font-size:15px}
#res{position:absolute;top:calc(92px + env(safe-area-inset-top));left:12px;right:12px;z-index:4;background:var(--card);border-radius:10px;max-height:40vh;overflow:auto;display:none}
#res div{padding:10px 12px;border-bottom:1px solid #0003;cursor:pointer}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:3;max-height:55vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:none}
.t{display:flex;gap:10px;padding:8px 0;border-top:1px solid #0003}.l{min-width:44px;font-weight:700}.m{color:var(--mut);font-size:13px}
.v{margin-left:auto;text-align:right}
.btn{position:absolute;right:12px;top:calc(104px + env(safe-area-inset-top));z-index:2;background:var(--card);color:var(--tx);border:0;border-radius:8px;padding:6px 10px}
#st{position:absolute;left:12px;top:calc(104px + env(safe-area-inset-top));z-index:2;font-size:12px;color:var(--mut);background:var(--card);border-radius:8px;padding:6px 10px}
pre{white-space:pre-wrap;font-size:11px;color:var(--mut)}
</style></head><body>
<div id="map"></div>
<header><h1>Cercanías · Madrid</h1><input id="q" placeholder="Busca tu estación…" autocomplete="off"></header>
<div id="st">Cargando…</div><button class="btn" id="sw">Satélite</button>
<div id="res"></div><div id="panel"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script>
const $=s=>document.querySelector(s),norm=c=>String(c).replace(/^0+(?=\d)/,'');
let stations=[],cur=null,adif='conectando',boards={};
const esri={version:8,sources:{s:{type:'raster',tileSize:256,attribution:'Esri World Imagery',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']}},layers:[{id:'s',type:'raster',source:'s'}]};
const osm={version:8,sources:{o:{type:'raster',tileSize:256,attribution:'© OpenStreetMap',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png']}},layers:[{id:'o',type:'raster',source:'o'}]};
const map=new maplibregl.Map({container:'map',style:esri,center:[-3.7,40.42],zoom:9.5});let sat=true;
$('#sw').onclick=()=>{sat=!sat;map.setStyle(sat?esri:osm);$('#sw').textContent=sat?'Satélite':'Mapa'};
const status=t=>{$('#st').textContent=t};

// --- Coordenadas (OpenStreetMap, desde el navegador; se guardan en caché) ---
const n=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\(.*?\)?$/,'').replace(/madrid\s*-\s*/g,'').replace(/cercanias/g,'').replace(/[^a-z0-9]/g,'');
async function coords(list){
 try{const c=JSON.parse(localStorage.getItem('cer_coords_v1')||'null');if(c){list.forEach(s=>{if(c[s.code])[s.lat,s.lon]=c[s.code]});return}}catch{}
 const q='[out:json][timeout:60];node["railway"~"^(station|halt)$"]["station"!="subway"]["station"!="light_rail"](39.9,-4.7,41.1,-3.1);out body;';
 for(const u of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
  try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q)});const els=(await r.json()).elements;if(!els?.length)continue;
   const o=els.filter(e=>e.tags?.name).map(e=>({k:n(e.tags.name),lat:e.lat,lon:e.lon}));const c={};
   list.forEach(s=>{const k=n(s.name);if(!k)return;const h=o.find(x=>x.k===k)||o.find(x=>x.k.length>3&&k.length>3&&(x.k.includes(k)||k.includes(x.k)));if(h){s.lat=h.lat;s.lon=h.lon;c[s.code]=[h.lat,h.lon]}});
   try{localStorage.setItem('cer_coords_v1',JSON.stringify(c))}catch{}return}catch(e){}}
}
function markers(){stations.filter(s=>s.lat).forEach(s=>{const e=document.createElement('div');
 e.style.cssText='width:12px;height:12px;border-radius:50%;background:#e30613;border:2px solid #fff;cursor:pointer';
 e.onclick=()=>openSt(s);new maplibregl.Marker({element:e}).setLngLat([s.lon,s.lat]).addTo(map)})}
fetch('/api/stations').then(r=>r.json()).then(async l=>{stations=l;status('Buscando estaciones en el mapa…');await coords(l);markers();
 status(l.filter(s=>s.lat).length+' estaciones en el mapa')});

// --- Adif (tiempo real, conexión directa desde el navegador) ---
const conn=new signalR.HubConnectionBuilder().withUrl('https://info.adif.es/InfoStation',{skipNegotiation:true,transport:signalR.HttpTransportType.WebSockets}).withAutomaticReconnect().configureLogging(signalR.LogLevel.Error).build();
conn.on('ReceiveMessage',raw=>{try{const d=JSON.parse(raw),c=norm(d?.station_settings?.code);if(!c)return;boards[c]={at:Date.now(),d};if(cur&&norm(cur.code)===c)render()}catch(e){}});
const join=async code=>{const c='PRO-ECM-'+code;await conn.invoke('JoinInfo',c);await conn.invoke('GetLastMessage',c)};
conn.onreconnected(()=>{if(cur)join(cur.code)});
conn.start().then(()=>{adif='ok';if(cur)join(cur.code)}).catch(e=>{adif='error: '+e.message;if(cur)render()});

const tl=t=>Object.entries(t).filter(([k])=>/time|hora|delay|retraso|eta|arriv|depart/i.test(k));
let nodata;function openSt(s){cur=s;clearTimeout(nodata);nodata=setTimeout(()=>{if(cur===s&&!boards[norm(s.code)]&&adif==='ok')$('#panel').innerHTML=`<b>${s.name}</b><p class="m">Adif no envía datos para esta estación (puede no tener pantalla de trenes).</p>`},10000);if(s.lat)map.flyTo({center:[s.lon,s.lat],zoom:13});render();if(adif==='ok')join(s.code).catch(()=>{})}
function render(){const p=$('#panel');p.style.display='block';const b=boards[norm(cur.code)];
 if(!b){p.innerHTML=`<b>${cur.name}</b><p class="m">${adif==='ok'?'Esperando datos de Adif… (si no llegan, esta estación puede no tener pantalla)':adif==='conectando'?'Conectando con Adif…':'No se pudo conectar con Adif. '+adif}</p>`;return}
 let tr=b.d.trains||[];const c=tr.filter(t=>t.traffic_type==='C');if(c.length)tr=c;
 p.innerHTML=`<b>${cur.name}</b> <span class="m">${new Date(b.at).toLocaleTimeString('es-ES')}</span>`+
 (tr.map(t=>{const d=t.destinations?.[0]||{};return`<div class="t"><div class="l">${(d.line||'·').replace(/ROD\w*|CER\w*/g,'')}</div><div>${d.name||d.station||'—'}<div class="m">${t.status??''}</div></div><div class="v">${tl(t).slice(0,2).map(x=>x[1]).join(' · ')}<div class="m">${t.platform?'vía '+String(t.platform).trim():''}</div></div></div>`}).join('')||'<p class="m">Sin trenes ahora mismo.</p>')+
 `<details><summary class="m">datos técnicos</summary><pre>${JSON.stringify(tr[0]||b.d,null,1)}</pre></details>`}
$('#q').oninput=e=>{const v=e.target.value.toLowerCase(),r=$('#res');const m=v?stations.filter(s=>s.name.toLowerCase().includes(v)).slice(0,12):[];
 r.style.display=m.length?'block':'none';r.innerHTML='';m.forEach(s=>{const d=document.createElement('div');d.textContent=s.name;d.onclick=()=>{r.style.display='none';openSt(s)};r.appendChild(d)})};
</script></body></html>
